<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homologador de Tickets</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1> Homologador de Tickets</h1>

        <p class="subtitulo">
            Selecciona el tipo de ticket
        </p>


        <!-- BOTONES DE TIPO DE TICKET -->

        <div class="tipos-ticket">

            <button id="btnNotResponding" class="tipo-btn activo" onclick="seleccionarTipo('not-responding')">

                NOT-RESPONDING

            </button>


            <button id="btnDown" class="tipo-btn" onclick="seleccionarTipo('down')">

                DOWN

            </button>

        </div>


        <!-- FORMULARIO -->

        <div class="formulario">

            <label for="equipo">
                Equipo
            </label>

            <input type="text" id="equipo" placeholder="Ej. COL_IMEX_AWS_LION_TVC_D3">


            <!-- CAMPOS NOT RESPONDING -->

            <div id="camposNotResponding">

                <label for="ip">
                    IP
                </label>

                <input type="text" id="ip" placeholder="Ej. 10.1.10.100">


                <label for="alarmas">
                    Número de alarmas
                </label>

                <input type="number" id="alarmas" placeholder="Ej. 2110">

            </div>


            <!-- CAMPOS DOWN -->

            <div id="camposDown" class="oculto">

                <label for="caidas">
                    Número de caídas
                </label>

                <input type="number" id="caidas" placeholder="Ej. 1044">


                <!-- PUERTO 1 -->

                <div class="puerto-principal">

                    <label for="puerto1">
                        Puerto 1
                    </label>

                    <input type="text" id="puerto1" placeholder="Ej. port-channel19/TVD-P2-BNS400SC...">

                </div>


                <!-- PUERTOS 2 Y 3 -->

                <div class="puertos-secundarios">

                    <div class="puerto-secundario">

                        <label for="puerto2">
                            Puerto 2
                        </label>

                        <input type="text" id="puerto2" placeholder="Opcional">

                    </div>


                    <div class="puerto-secundario">

                        <label for="puerto3">
                            Puerto 3
                        </label>

                        <input type="text" id="puerto3" placeholder="Opcional">

                    </div>

                </div>

            </div>


            <!-- BOTÓN GENERAR -->

            <button class="botonGenerar" onclick="generarTicket()">

                Generar Contenido

            </button>

        </div>


        <!-- RESULTADO -->

        <div class="resultado">

            <h2>Título del ticket</h2>

            <textarea id="tituloResultado" readonly>
            </textarea>


            <h2>Cuerpo del ticket</h2>

            <textarea id="cuerpoResultado" readonly>
            </textarea>


            <div class="botones-resultado">

                <button class="botonCopiar tipo-btn activo" onclick="copiarTicket()">

                    Copiar Ticket

                </button>


                <button class="botonLimpiar tipo-btn" onclick="limpiarFormulario()">

                    Limpiar

                </button>

            </div>


            <p id="mensajeCopiado"></p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
